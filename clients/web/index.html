<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="AI Real-time Translation Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AYTME" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AYTME | Real-time AI Translation</title>
    
    <!-- Permanent Cache Fix: Force browsers to re-validate index.html on every visit -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[AYTME] Global error:', msg, 'at', url, ':', lineNo, ':', columnNo, error);
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('[AYTME] Unhandled rejection:', event.reason);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
