services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aytme_dev
      POSTGRES_PASSWORD: devpass123
      POSTGRES_DB: aytme_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aytme_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app/app
      - ./services/billing:/app/services/billing
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "
        echo '--- Running Alembic migrations ---' &&
        alembic upgrade head || echo 'Migration warning' &&
        echo '--- Starting API server ---' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped

  frontend:
    build:
      context: ./clients/web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_LIVEKIT_URL=wss://aytme-56n8aplm.livekit.cloud
    depends_on:
      - api
    volumes:
      - ./clients/web/src:/app/src
      - ./clients/web/public:/app/public
      - ./clients/web/index.html:/app/index.html
      - ./clients/web/vite.config.js:/app/vite.config.js
      - ./clients/web/tailwind.config.js:/app/tailwind.config.js
      - ./clients/web/postcss.config.js:/app/postcss.config.js
    restart: unless-stopped

volumes:
  postgres_data:
